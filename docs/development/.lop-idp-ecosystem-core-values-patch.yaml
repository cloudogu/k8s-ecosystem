components:
  lop-idp:
    version: 1.1.0
    valuesObject:
      defaultConfig:
        env:
          initialDomain: "k3ces.localdomain"
      ldap:
        secrets:
          initialAdminPasswordSecretRef:
            create: false
            name: initial-admin-password
            passwordKey: admin-password
      cas:
        configuration:
          normal:
            allow_local_urls: "true"
  k8s-dogu-operator:
    valuesObject:
      controllerManager:
        env:
          authRegistrationEnabled: true
          disablePostfixDependencyCheck: true
  k8s-auth-registration-crd:
    version: 1.0.0
  postfix:
    version: 3.10.8-3